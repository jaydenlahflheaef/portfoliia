<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Jayden Kim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'COTN';
      src: url('Cotn3-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050008;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Space Grotesk', sans-serif;
    }

    /* ── SCENE ── */
    #scene-view { position: fixed; inset: 0; }
    #scene-svg  { width: 100%; height: 100%; }


    /* panel text hover float */
    .panel-text {
      animation: panelFloat 3.6s ease-in-out infinite;
    }
    .panel-text-sub {
      animation: panelFloat 3.6s ease-in-out infinite;
      animation-delay: 0.4s;
    }
    @keyframes panelFloat {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-3px); }
    }

    /* lamp flicker */
    .lamp-flicker { animation: lflicker 9s ease-in-out infinite; }
    @keyframes lflicker {
      0%,93%,100% { opacity: 1; }
      94% { opacity: 0.7; }
      96% { opacity: 0.9; }
    }

    /* display glow pulse */
    .glow-pulse {
      animation: glowPulse 2.8s ease-in-out infinite;
    }
    .floor-pulse {
      animation: glowPulse 3.4s ease-in-out infinite;
      animation-delay: 0.6s;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.18; }
      50%       { opacity: 0.40; }
    }

    /* star twinkle */
    .star {
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--dly);
    }
    @keyframes twinkle {
      0%, 100% { opacity: var(--lo); }
      50%       { opacity: var(--hi); }
    }

    /* city window — static, no flicker */
    .city-win { opacity: var(--hi); }

    /* rooftop dot — static */
    .roof-blink { opacity: 0.85; }

    /* ── FRONT VIEW (first-person SVG scene) ── */
    #front-view {
      position: fixed;
      inset: 0;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #front-view.visible { opacity: 1; pointer-events: all; }
    #front-svg { width: 100%; height: 100%; }

    /* back button */
    #back-btn {
      position: absolute;
      top: 1.6rem; left: 1.8rem;
      display: flex; align-items: center; gap: 0.4rem;
      color: rgba(200, 220, 235, 0.6);
      font-family: 'COTN', sans-serif;
      font-size: 1rem; letter-spacing: 0.12em;
      background: none; border: none; cursor: pointer;
      padding: 0.35rem 0.55rem; border-radius: 3px;
      transition: color 0.2s, background 0.2s;
      z-index: 2;
    }
    #back-btn:hover  { color: rgba(220, 238, 255, 1); background: rgba(150,200,235,0.1); }
    #back-btn:focus-visible { outline: 1px solid rgba(200,220,240,0.4); outline-offset: 3px; }
    #back-btn:active { color: #fff; }

    /* ── VM MACHINE — styled like image.jpg ── */
    .vm-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(480px, 88vw);
      max-height: 92vh;
      overflow: hidden;
      background: #8e9888;
      border-radius: 4px 4px 2px 2px;
      box-shadow:
        0 0 0 2px #5c6658,
        0 0 0 4px #3c4438,
        0 0 150px rgba(130,195,255,0.35),
        0 28px 130px rgba(0,0,0,0.99);
      z-index: 1;
    }

    /* top brand strip — matches gray-green body */
    .vm-header {
      background: #7c8877;
      border-bottom: 3px solid #4c5448;
      padding: 0.5rem 1rem 0.45rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    .vm-header-jp {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.1rem;
      color: rgba(222, 242, 255, 0.93);
      letter-spacing: 0.4em;
      text-shadow: 0 0 22px rgba(150,210,255,0.8);
    }
    .vm-header-en {
      font-family: 'COTN', sans-serif;
      font-size: 0.72rem;
      color: rgba(175,200,215,0.60);
      letter-spacing: 0.18em;
    }

    /* dark metal display bezel */
    .vm-display-outer {
      background: #3c4440;
      padding: 9px 11px;
      flex-shrink: 0;
      border-top: 2px solid #282e2c;
      border-bottom: 2px solid #282e2c;
    }

    /* backlit display — bright white-cyan like image.jpg */
    .vm-display-inner {
      background: linear-gradient(180deg, #cceaf8 0%, #a8d4ec 55%, #92c4e0 100%);
      border-radius: 2px;
      overflow: visible;
      box-shadow:
        inset 0 0 55px rgba(190,235,255,0.6),
        inset 0 0 18px rgba(255,255,255,0.5),
        0 0 40px rgba(110,185,255,0.45);
    }

    /* product rows */
    .vm-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 5px 5px 0;
    }
    .vm-row:last-child { padding-bottom: 5px; }

    /* metallic shelf divider */
    .vm-row-divider {
      height: 9px;
      background: linear-gradient(180deg, #38403c 0%, #2c3430 55%, #202826 100%);
      margin: 2px 0;
      box-shadow: 0 1px 0 rgba(255,255,255,0.06), inset 0 1px 0 rgba(0,0,0,0.5);
    }

    /* individual drink slot */
    .vm-slot {
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.14s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.14s ease;
      border: 1px solid rgba(0,0,0,0.28);
    }
    .vm-slot:hover {
      transform: scale(1.07) translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.65), 0 0 14px rgba(180,225,255,0.25);
      z-index: 2;
    }
    .vm-slot:focus-visible { outline: 2px solid rgba(180,220,255,0.75); outline-offset: 2px; }
    .vm-slot:active { transform: scale(0.97); }

    /* glass-case light reflection */
    .vm-slot::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 0; width: 32%;
      background: linear-gradient(90deg, rgba(255,255,255,0.26) 0%, transparent 100%);
      pointer-events: none;
      border-radius: 3px 0 0 3px;
    }

    .vm-row-1 .vm-slot { height: 118px; }
    .vm-row-2 .vm-slot { height: 88px; }
    .vm-row-3 .vm-slot { height: 88px; }

    /* artwork name label at slot bottom */
    .slot-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 0.16rem 0.25rem;
      font-size: 0.46rem;
      letter-spacing: 0.09em;
      color: rgba(235, 248, 255, 0.92);
      background: rgba(0,0,0,0.74);
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    /* below display: cork board + control panel */
    .vm-below {
      display: grid;
      grid-template-columns: 56% 44%;
      background: #8e9888;
      border-top: 2px solid #4c5448;
      flex-shrink: 0;
    }

    /* cork notice board — tan/amber like image.jpg */
    .vm-notice {
      background: #8e9888;
      padding: 8px 10px;
      border-right: 2px solid #5c6658;
    }
    .vm-notice-paper {
      background: #c4a03c;
      border-radius: 3px;
      padding: 7px 9px;
      border: 1px solid #9a7e28;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.30), 0 1px 0 rgba(255,255,255,0.04);
    }
    .vm-notice-line {
      height: 2px;
      background: #5c4016;
      border-radius: 1px;
      margin-bottom: 5px;
      opacity: 0.55;
    }
    .vm-notice-line:last-child { margin-bottom: 0; width: 58%; }
    .vm-notice-title {
      font-size: 0.6rem;
      color: #3a2406;
      letter-spacing: 0.12em;
      font-family: 'Noto Serif JP', serif;
      margin-bottom: 5px;
    }

    /* right control panel — dark metal */
    .vm-ctrl-panel {
      background: #28302c;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: flex-start;
    }
    .vm-ctrl-black {
      width: 100%;
      height: 30px;
      background: #0a0e0c;
      border-radius: 2px;
      border: 1px solid #181e1a;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
    }
    .vm-ctrl-slot {
      width: 62%;
      height: 4px;
      background: #060a08;
      border-radius: 2px;
    }

    /* bottom section */
    .vm-bottom {
      background: #28302c;
      border-top: 3px solid #181e1a;
      padding: 7px 10px;
      flex-shrink: 0;
    }
    .vm-btn-row {
      display: flex;
      gap: 5px;
      margin-bottom: 6px;
    }
    .vm-btn {
      flex: 1;
      height: 13px;
      background: #181e1a;
      border-radius: 2px;
      border: 1px solid #222a24;
    }
    .vm-coin-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 5px;
    }
    .vm-coin-slot {
      flex: 1;
      height: 4px;
      background: #060a08;
      border-radius: 2px;
    }
    .vm-indicator-lights { display: flex; gap: 4px; }
    .vm-dot { width: 5px; height: 5px; border-radius: 50%; }
    .vm-dot-g { background: #3af014; box-shadow: 0 0 7px rgba(58,240,20,1); }
    .vm-dot-r { background: #ff2055; box-shadow: 0 0 7px rgba(255,32,85,1); }
    .vm-dispense-housing {
      background: #0a0e0c;
      border-radius: 3px;
      padding: 4px 6px;
      border: 1px solid #181e1a;
    }
    .vm-dispense-slot {
      width: 100%;
      height: 14px;
      background: #040608;
      border-radius: 2px;
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════ -->
<!-- SCENE VIEW                              -->
<!-- ════════════════════════════════════════ -->
<div id="scene-view">
<svg id="scene-svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Sky atmosphere — deep navy/indigo base + vivid magenta nebula -->
  <radialGradient id="sg1" cx="50%" cy="35%" r="65%">
    <stop offset="0%" stop-color="#e040a0" stop-opacity="0.72"/>
    <stop offset="100%" stop-color="#0a0418" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sg2" cx="38%" cy="22%" r="55%">
    <stop offset="0%" stop-color="#c020c8" stop-opacity="0.50"/>
    <stop offset="100%" stop-color="#0a0418" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sg3" cx="65%" cy="18%" r="48%">
    <stop offset="0%" stop-color="#d030b0" stop-opacity="0.40"/>
    <stop offset="100%" stop-color="#0a0418" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sg4" cx="25%" cy="50%" r="42%">
    <stop offset="0%" stop-color="#4a1080" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#0a0418" stop-opacity="0"/>
  </radialGradient>
  <!-- Blue / indigo nebula clouds -->
  <radialGradient id="sg5" cx="88%" cy="28%" r="40%">
    <stop offset="0%" stop-color="#1a40c8" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#0a0418" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sg6" cx="12%" cy="38%" r="36%">
    <stop offset="0%" stop-color="#2030a8" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#0a0418" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sg7" cx="55%" cy="8%" r="38%">
    <stop offset="0%" stop-color="#3050e0" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#0a0418" stop-opacity="0"/>
  </radialGradient>

  <!-- Ground — pink/magenta sky reflection near horizon, dark below -->
  <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#2a0830"/>
    <stop offset="30%"  stop-color="#180620"/>
    <stop offset="100%" stop-color="#060410"/>
  </linearGradient>

  <!-- Road/sidewalk — cool purple-slate -->
  <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#1e1a3a"/>
    <stop offset="50%"  stop-color="#181430"/>
    <stop offset="100%" stop-color="#121028"/>
  </linearGradient>

  <!-- VM display illumination -->
  <radialGradient id="vmDispGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#a8ccd8" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#a8ccd8" stop-opacity="0"/>
  </radialGradient>

  <!-- VM floor glow -->
  <radialGradient id="vmFloorG" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#88b8cc" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#88b8cc" stop-opacity="0"/>
  </radialGradient>

  <!-- lamp halos -->
  <radialGradient id="lh1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff9944" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#ff9944" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lh2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff9944" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#ff9944" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lh3" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff9944" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#ff9944" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lh4" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff9944" stop-opacity="0.09"/>
    <stop offset="100%" stop-color="#ff9944" stop-opacity="0"/>
  </radialGradient>

  <!-- Atmosphere fog -->
  <linearGradient id="fogG" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#080418" stop-opacity="0.45"/>
    <stop offset="22%" stop-color="#080418" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#080418" stop-opacity="0"/>
  </linearGradient>

  <!-- Vignette -->
  <radialGradient id="vigG" cx="50%" cy="55%" r="72%">
    <stop offset="0%"   stop-color="#080418" stop-opacity="0"/>
    <stop offset="60%"  stop-color="#080418" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#080418" stop-opacity="0.80"/>
  </radialGradient>

  <!-- City background glow -->
  <radialGradient id="cityGlowG" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#c040c0" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#c040c0" stop-opacity="0"/>
  </radialGradient>

  <!-- Moonlight wash from upper-left -->
  <radialGradient id="moonlightG" cx="15%" cy="12%" r="85%">
    <stop offset="0%"   stop-color="#c8a8ff" stop-opacity="0.22"/>
    <stop offset="55%"  stop-color="#c8a8ff" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#c8a8ff" stop-opacity="0"/>
  </radialGradient>

  <!-- Ground purple ambient from moonlight -->
  <radialGradient id="groundAmbG" cx="20%" cy="10%" r="80%">
    <stop offset="0%"   stop-color="#7030b0" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#7030b0" stop-opacity="0"/>
  </radialGradient>

  <!-- Pink/magenta sky reflection on ground -->
  <linearGradient id="pinkReflG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#e030a0" stop-opacity="0.32"/>
    <stop offset="40%"  stop-color="#c02090" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#c02090" stop-opacity="0"/>
  </linearGradient>

  <!-- Moonlight shadow from vending machine -->
  <linearGradient id="vmShadowG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#000000" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>

  <!-- Road wet-reflection sheen -->
  <linearGradient id="roadShineG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#8050cc" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#8050cc" stop-opacity="0.04"/>
  </linearGradient>

  <!-- Shutter pattern: horizontal metal strips -->
  <pattern id="shutterP" x="0" y="0" width="300" height="18" patternUnits="userSpaceOnUse">
    <rect width="300" height="9"  fill="#0c0e0c"/>
    <rect y="9" width="300" height="9" fill="#0f110f"/>
    <line x1="0" y1="8.5"  x2="300" y2="8.5"  stroke="#080a08" stroke-width="1.5"/>
    <line x1="0" y1="17.5" x2="300" y2="17.5" stroke="#080a08" stroke-width="1.5"/>
    <!-- subtle 3D ridge highlight -->
    <line x1="0" y1="1" x2="300" y2="1" stroke="#111310" stroke-width="0.5" opacity="0.5"/>
    <line x1="0" y1="10" x2="300" y2="10" stroke="#111310" stroke-width="0.5" opacity="0.5"/>
  </pattern>

  <!-- VM display inner gradient -->
  <linearGradient id="vmDisplayG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#a0c4d4"/>
    <stop offset="100%" stop-color="#88b0c4"/>
  </linearGradient>

  <!-- Filters -->
  <filter id="blur8"  x="-60%" y="-60%"   width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="grainF" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85 0.35" numOctaves="4" seed="9"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.05  0 0 0 0 0.18  0 0 0 0.45 0"/>
  </filter>
  <filter id="blur20" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="blur40" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="tealGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b5"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b2"/>
    <feMerge><feMergeNode in="b5"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
  </filter>
  <filter id="glow5"  x="-60%" y="-60%"   width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="dustGlow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b9"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b3"/>
    <feMerge><feMergeNode in="b9"/><feMergeNode in="b9"/><feMergeNode in="b3"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b5"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b1"/>
    <feMerge><feMergeNode in="b5"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <clipPath id="clip"><rect width="1200" height="675"/></clipPath>
  <clipPath id="moonRaysClip"><rect width="1200" height="322"/></clipPath>
</defs>

<g clip-path="url(#clip)">

<!-- ── SKY — photo background ── -->
<rect width="1200" height="318" fill="#08001a"/>
<image x="0" y="0" width="1200" height="318" href="sky/sky-scene.png" preserveAspectRatio="xMidYMid slice" style="filter:brightness(1.6) saturate(1.4)"/>
<!-- ── MOON ── -->

<ellipse cx="180" cy="80" rx="34"  ry="34"  fill="#ffffff" opacity="0.70" filter="url(#blur8)"/>
<circle  cx="180" cy="80" r="28"   fill="#ffffff"/>
<circle  cx="183" cy="82" r="26"   fill="#f5f5ff" opacity="0.10"/>
<circle  cx="172" cy="72" r="5.5"  fill="#e8e8ee" opacity="0.22"/>
<circle  cx="185" cy="82" r="3.5"  fill="#e8e8ee" opacity="0.18"/>
<circle  cx="175" cy="88" r="2.5"  fill="#e8e8ee" opacity="0.16"/>
<circle  cx="174" cy="72" r="12"   fill="#ffffff" opacity="0.60"/>
<circle  cx="171" cy="69" r="6"    fill="#ffffff" opacity="0.80"/>
<ellipse cx="180" cy="80" rx="24"  ry="24" fill="#ffffff" opacity="0.35" filter="url(#blur8)"/>
<line x1="180" y1="30"  x2="180" y2="130" stroke="#ffffff" stroke-width="1.2" opacity="0.22"/>

(function () {
  const ns = 'http://www.w3.org/2000/svg';
  const g = document.getElementById('front-wins');
  if (!g) return;
  const warm = ['#f5d065','#ffe488','#f2b855','#fffaaa','#ffc85a','#e8c8ff','#d8b0ff','#fde8a0','#ffddaa'];

    [180,290,52,200],[238,268,45,222],[289,302,38,188],[333,274,55,216],
    [394,286,48,204],[448,308,42,182],[210,310,18,180],[368,295,14,195],
    [740,288,50,202],[796,270,46,220],[848,300,56,190],[910,276,42,214],
    [958,292,50,198],[1014,310,40,180],[770,308,18,182],[983,296,14,194],
  ];
  blds.forEach(([bx, by, bw, bh]) => {
    const cols = Math.max(2, Math.floor(bw / 7));

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() > 0.45) continue;
        const wx = bx + 3 + c * (bw - 6) / Math.max(cols - 1, 1);
        const wy = by + 4 + r * (bh - 8) / Math.max(rows - 1, 1);
        if (wy >= 338) continue;
        const el = document.createElementNS(ns, 'rect');
        el.setAttribute('x', wx.toFixed(1));
        el.setAttribute('y', wy.toFixed(1));
        el.setAttribute('width',  Math.random() < 0.28 ? '3' : '2');
        el.setAttribute('height', Math.random() < 0.28 ? '4' : '3');
        el.setAttribute('fill', warm[Math.floor(Math.random() * warm.length)]);

(function () {
  const ns = 'http://www.w3.org/2000/svg';
  const bldG = document.getElementById('city-buildings');
  const winG = document.getElementById('city-windows');
  const HORIZON = 318;

  // [x, width, height]
  const defs = [
    // left extension x=0..275
    [0,44,88],[48,58,122],[110,38,68],[152,50,105],[206,42,82],[250,36,60],
    // original buildings
    [275,52,118],[332,36,72],[373,58,132],[436,42,96],
    [483,54,158],[542,40,106],[587,66,148],[658,46,84],
    [709,50,122],[764,44,98],[813,60,134],[878,46,76],
    [929,64,120],[998,50,90],[1053,56,114],[1114,54,92],[1173,46,70],
    // narrower accent buildings (original)
    [310,20,88],[358,16,62],[420,18,78],[466,18,68],
    [620,22,105],[695,18,68],[742,24,68],[798,16,75],
    [856,20,98],[918,18,58],[986,20,72],[1040,16,82],[1100,18,65],[1160,20,55],
    // left accent fillers
    [22,16,72],[80,18,95],[132,20,58],[178,16,68],[228,18,75],
  ];

  const warmPalette = ['#f5d065','#ffe488','#f2b855','#fffaaa','#ffc85a','#e8c8ff','#d8b0ff','#cc99ff','#fde8a0','#f0d8ff'];

  function mk(tag) { return document.createElementNS(ns, tag); }

  defs.forEach(([bx, bw, bh]) => {
    const by = HORIZON - bh;

    // building silhouette
    const rect = mk('rect');
    rect.setAttribute('x', bx); rect.setAttribute('y', by);
    rect.setAttribute('width', bw); rect.setAttribute('height', bh);
    rect.setAttribute('fill', '#090b0d');
    bldG.appendChild(rect);

    // slight purple top gradient suggestion
    const topRect = mk('rect');
    topRect.setAttribute('x', bx); topRect.setAttribute('y', by);
    topRect.setAttribute('width', bw); topRect.setAttribute('height', Math.min(bh * 0.3, 30));
    topRect.setAttribute('fill', '#0d0a14'); topRect.setAttribute('opacity', '0.6');
    bldG.appendChild(topRect);

    // windows — small, dense, distant-city look
    const colSpacing = Math.max(5, Math.floor(bw / Math.max(3, Math.floor(bw / 8))));
    const rowSpacing = Math.max(7, Math.floor(bh / Math.max(3, Math.floor(bh / 10))));
    for (let wy = by + 3; wy < by + bh - 4; wy += rowSpacing) {
      for (let wx = bx + 2; wx < bx + bw - 2; wx += colSpacing) {
        if (Math.random() < 0.42) {
          const ww = Math.random() < 0.25 ? 3 : 2;
          const wh = Math.random() < 0.25 ? 4 : 3;
          const fill = warmPalette[Math.floor(Math.random() * warmPalette.length)];
          const op = (0.4 + Math.random() * 0.6).toFixed(2);
          const w = mk('rect');
          w.setAttribute('x', wx); w.setAttribute('y', wy);
          w.setAttribute('width', ww); w.setAttribute('height', wh);
          w.setAttribute('fill', fill); w.setAttribute('opacity', op);
          if (Math.random() < 0.16) {
            w.setAttribute('class', 'city-win');
            const lo = (parseFloat(op) * 0.3).toFixed(2);
            w.style.setProperty('--dur', (2 + Math.random() * 5).toFixed(1) + 's');
            w.style.setProperty('--dly', (Math.random() * 9).toFixed(1) + 's');
            w.style.setProperty('--lo', lo);
            w.style.setProperty('--hi', op);
          }
          winG.appendChild(w);
        }
      }
    }

    // rooftop blink light (40% chance)
    if (Math.random() < 0.4 && bh > 80) {
      const dot = mk('circle');
      dot.setAttribute('cx', bx + bw / 2);
      dot.setAttribute('cy', by - 2);
      dot.setAttribute('r', '2');
      dot.setAttribute('fill', '#ff2222');
      dot.setAttribute('class', 'roof-blink');
      dot.style.setProperty('--dly', (Math.random() * 3).toFixed(1) + 's');
      winG.appendChild(dot);
    }
  });
})();

      const line = document.createElementNS(ns, 'line');
      const rad = angle * Math.PI / 180;
      const thisLen = angle % 90 === 0 ? len : len * 0.55;
      line.setAttribute('x1', (x - Math.cos(rad) * thisLen).toFixed(1));
      line.setAttribute('y1', (y - Math.sin(rad) * thisLen).toFixed(1));
      line.setAttribute('x2', (x + Math.cos(rad) * thisLen).toFixed(1));
      line.setAttribute('y2', (y + Math.sin(rad) * thisLen).toFixed(1));
      line.setAttribute('stroke', '#ffffff');
      line.setAttribute('stroke-width', angle % 90 === 0 ? '1.2' : '0.7');
      line.style.opacity = '0';
      line.style.transition = 'opacity 0.35s ease-in-out';
      cross.appendChild(line);
    });
    svg.appendChild(cross);
    requestAnimationFrame(() => {
      star.style.opacity = '1';
      cross.querySelectorAll('line').forEach(l => l.style.opacity = '0.9');
    });
    setTimeout(() => {
      star.style.opacity = '0';
      cross.querySelectorAll('line').forEach(l => l.style.opacity = '0');
      setTimeout(() => { star.remove(); cross.remove(); }, 400);
    }, 700 + Math.random() * 500);
  }

  function scheduleShine() {
    const delay = 1500 + Math.random() * 3000;
    setTimeout(() => {
      const x = (Math.random() * 1150 + 25).toFixed(1);
      const y = (Math.random() * 290 + 10).toFixed(1);
      spawnShine(x, y, 'stars');
      scheduleShine();
    }, delay);
  }
  scheduleShine();
})();

// ── SHOOTING STARS ──
(function () {
  const ns = 'http://www.w3.org/2000/svg';
  let gradId = 0;

  // cfg: { svgId, groupId, glowFilter, x0, xw, y0, yh }
  function spawnShootingStar(cfg) {
    const svg = document.getElementById(cfg.svgId);
    if (!svg) return;

    const angleDeg = 28 + Math.random() * 22;
    const tailLen  = 90  + Math.random() * 110;
    const dist     = 220 + Math.random() * 280;
    const duration = 700 + Math.random() * 500;

    const sx = cfg.x0 + Math.random() * cfg.xw;
    const sy = cfg.y0 + Math.random() * cfg.yh;
    const dx = Math.cos(angleDeg * Math.PI / 180);
    const dy = Math.sin(angleDeg * Math.PI / 180);

    // Gradient fixed in local space — tail at (-tailLen,0), head at (0,0)
    // userSpaceOnUse coords are in the element's local coordinate system,
    // so they stay aligned with the line as the group moves.
    const gid  = 'ssg' + (gradId++);
    const defs = svg.querySelector('defs');
    const grad = document.createElementNS(ns, 'linearGradient');
    grad.setAttribute('id', gid);
    grad.setAttribute('gradientUnits', 'userSpaceOnUse');
    grad.setAttribute('x1', -tailLen); grad.setAttribute('y1', 0);
    grad.setAttribute('x2', 0);        grad.setAttribute('y2', 0);
    const s0 = document.createElementNS(ns, 'stop');
    s0.setAttribute('offset', '0%'); s0.setAttribute('stop-color', '#ffffff'); s0.setAttribute('stop-opacity', '0');
    const s1 = document.createElementNS(ns, 'stop');
    s1.setAttribute('offset', '100%'); s1.setAttribute('stop-color', '#ffffff'); s1.setAttribute('stop-opacity', '1');
    grad.appendChild(s0); grad.appendChild(s1);
    defs.appendChild(grad);

    // Group holds line + head in local space; only its transform changes each frame
    const container = document.getElementById(cfg.groupId) || svg;
    const g = document.createElementNS(ns, 'g');

    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', -tailLen); line.setAttribute('y1', 0);
    line.setAttribute('x2', 0);        line.setAttribute('y2', 0);
    line.setAttribute('stroke', 'url(#' + gid + ')');
    line.setAttribute('stroke-width', '1.5');
    line.setAttribute('stroke-linecap', 'round');
    g.appendChild(line);

    const head = document.createElementNS(ns, 'circle');
    head.setAttribute('cx', 0); head.setAttribute('cy', 0); head.setAttribute('r', '2');
    head.setAttribute('fill', '#ffffff');
    head.setAttribute('filter', 'url(#' + cfg.glowFilter + ')');
    g.appendChild(head);

    container.appendChild(g);

    // CSS animation handles opacity — zero JS overhead for fade
    const fadeKf = [
      { opacity: 0 },
      { opacity: 1, offset: 0.08 },
      { opacity: 1, offset: 0.75 },
      { opacity: 0 }
    ];
    g.animate(fadeKf, { duration, fill: 'forwards', easing: 'linear' });

    // Only 1 attribute change per frame: the group transform
    const t0 = performance.now();
    function tick(now) {
      const p  = Math.min((now - t0) / duration, 1);
      const hx = (sx + dx * dist * p).toFixed(1);
      const hy = (sy + dy * dist * p).toFixed(1);
      g.setAttribute('transform', `translate(${hx},${hy}) rotate(${angleDeg})`);
      if (p < 1) { requestAnimationFrame(tick); }
      else { g.remove(); grad.remove(); }
    }
    requestAnimationFrame(tick);
  }

  function makeScheduler(cfg) {
    function run() {
      const delay = 2000 + Math.random() * 4000;
      setTimeout(() => { spawnShootingStar(cfg); run(); }, delay);
    }
    setTimeout(run, 1000 + Math.random() * 2000);
  }

  // Main scene sky: x 30–930, y 15–175
  makeScheduler({ svgId: 'scene-svg', groupId: 'stars', glowFilter: 'glow5',
                  x0: 30, xw: 900, y0: 15, yh: 160 });

  // Front view sky: x 200–980, y -100 to 180 (above horizon ~310)
  makeScheduler({ svgId: 'front-svg', groupId: 'front-stars', glowFilter: 'fglow5',
                  x0: 200, xw: 780, y0: -100, yh: 280 });
})();

// ── VM CLICK HANDLING ──
const vmHit    = document.getElementById('vm-hit');
const frontView = document.getElementById('front-view');
const backBtn   = document.getElementById('back-btn');

function openVending() {
  frontView.classList.add('visible');
}

function closeVending() {
  frontView.classList.remove('visible');
}

vmHit.addEventListener('click',   openVending);
vmHit.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openVending(); } });
backBtn.addEventListener('click',    closeVending);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVending(); });
</script>
</body>
