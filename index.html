<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>After Hours — Jayden Kim</title>
  <meta name="description" content="An after-hours art world by Jayden Kim. Take the long way home.">
  <meta name="theme-color" content="#110b25">
  <link rel="stylesheet" href="night-world.css">
  <link rel="icon" href="data:,">
  <!-- Tailwind CDN removed — zero utility classes were used; it was a large
       render-blocking script that dominated page load time -->
  <style>
    @font-face {
      font-family: 'COTN';
      src: url('Cotn3-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050008;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Trebuchet MS', sans-serif;
    }

    /* ── SCENE ── */
    #scene-view { position: fixed; inset: 0; }
    #scene-svg  { position: relative; z-index: 1; width: 100%; height: 100%; }


    /* panel text hover float */
    .panel-text {
      animation: panelFloat 3.6s ease-in-out infinite;
    }
    .panel-text-sub {
      animation: panelFloat 3.6s ease-in-out infinite;
      animation-delay: 0.4s;
    }
    @keyframes panelFloat {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-3px); }
    }

    /* lamp flicker */
    .lamp-flicker { animation: lflicker 9s ease-in-out infinite; }
    @keyframes lflicker {
      0%,93%,100% { opacity: 1; }
      94% { opacity: 0.7; }
      96% { opacity: 0.9; }
    }

    /* display glow pulse */
    .glow-pulse {
      animation: glowPulse 2.8s ease-in-out infinite;
    }
    .floor-pulse {
      animation: glowPulse 3.4s ease-in-out infinite;
      animation-delay: 0.6s;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.18; }
      50%       { opacity: 0.40; }
    }

    /* canvas galaxy — particle engine rendered behind the SVG scene */
    #galaxy-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      /* color grade is baked into the engine's sprites — a CSS filter here
         would re-run over the whole canvas every frame (major lag) */
    }

    /* star twinkle */
    .star {
      animation: twinkle var(--dur) ease-in-out infinite;
      animation-delay: var(--dly);
    }
    @keyframes twinkle {
      0%, 100% { opacity: var(--lo); }
      50%       { opacity: var(--hi); }
    }

    /* city window — static, no flicker */
    .city-win { opacity: var(--hi); }

    /* rooftop dot — static */
    .roof-blink { opacity: 0.85; }

    /* ── FRONT VIEW (first-person SVG scene) ── */
    #front-view {
      position: fixed;
      inset: 0;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #front-view.visible { opacity: 1; pointer-events: all; }
    #front-svg { width: 100%; height: 100%; }

    /* back button */
    #back-btn {
      position: absolute;
      top: 1.6rem; left: 1.8rem;
      display: flex; align-items: center; gap: 0.4rem;
      color: rgba(200, 220, 235, 0.6);
      font-family: 'COTN', sans-serif;
      font-size: 1rem; letter-spacing: 0.12em;
      background: none; border: none; cursor: pointer;
      padding: 0.35rem 0.55rem; border-radius: 3px;
      transition: color 0.2s, background 0.2s;
      z-index: 2;
    }
    #back-btn:hover  { color: rgba(220, 238, 255, 1); background: rgba(150,200,235,0.1); }
    #back-btn:focus-visible { outline: 1px solid rgba(200,220,240,0.4); outline-offset: 3px; }
    #back-btn:active { color: #fff; }

    /* ── VM MACHINE — styled like image.jpg ── */
    .vm-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(480px, 88vw);
      max-height: 92vh;
      overflow: hidden;
      background: #8e9888;
      border-radius: 4px 4px 2px 2px;
      box-shadow:
        0 0 0 2px #5c6658,
        0 0 0 4px #3c4438,
        0 0 150px rgba(130,195,255,0.35),
        0 28px 130px rgba(0,0,0,0.99);
      z-index: 1;
    }

    /* top brand strip — matches gray-green body */
    .vm-header {
      background: #7c8877;
      border-bottom: 3px solid #4c5448;
      padding: 0.5rem 1rem 0.45rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    .vm-header-jp {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.1rem;
      color: rgba(222, 242, 255, 0.93);
      letter-spacing: 0.4em;
      text-shadow: 0 0 22px rgba(150,210,255,0.8);
    }
    .vm-header-en {
      font-family: 'COTN', sans-serif;
      font-size: 0.72rem;
      color: rgba(175,200,215,0.60);
      letter-spacing: 0.18em;
    }

    /* dark metal display bezel */
    .vm-display-outer {
      background: #3c4440;
      padding: 9px 11px;
      flex-shrink: 0;
      border-top: 2px solid #282e2c;
      border-bottom: 2px solid #282e2c;
    }

    /* backlit display — bright white-cyan like image.jpg */
    .vm-display-inner {
      background: linear-gradient(180deg, #cceaf8 0%, #a8d4ec 55%, #92c4e0 100%);
      border-radius: 2px;
      overflow: visible;
      box-shadow:
        inset 0 0 55px rgba(190,235,255,0.6),
        inset 0 0 18px rgba(255,255,255,0.5),
        0 0 40px rgba(110,185,255,0.45);
    }

    /* product rows */
    .vm-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 5px 5px 0;
    }
    .vm-row:last-child { padding-bottom: 5px; }

    /* metallic shelf divider */
    .vm-row-divider {
      height: 9px;
      background: linear-gradient(180deg, #38403c 0%, #2c3430 55%, #202826 100%);
      margin: 2px 0;
      box-shadow: 0 1px 0 rgba(255,255,255,0.06), inset 0 1px 0 rgba(0,0,0,0.5);
    }

    /* individual drink slot */
    .vm-slot {
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.14s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.14s ease;
      border: 1px solid rgba(0,0,0,0.28);
    }
    .vm-slot:hover {
      transform: scale(1.07) translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.65), 0 0 14px rgba(180,225,255,0.25);
      z-index: 2;
    }
    .vm-slot:focus-visible { outline: 2px solid rgba(180,220,255,0.75); outline-offset: 2px; }
    .vm-slot:active { transform: scale(0.97); }

    /* glass-case light reflection */
    .vm-slot::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 0; width: 32%;
      background: linear-gradient(90deg, rgba(255,255,255,0.26) 0%, transparent 100%);
      pointer-events: none;
      border-radius: 3px 0 0 3px;
    }

    .vm-row-1 .vm-slot { height: 118px; }
    .vm-row-2 .vm-slot { height: 88px; }
    .vm-row-3 .vm-slot { height: 88px; }

    /* artwork name label at slot bottom */
    .slot-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 0.16rem 0.25rem;
      font-size: 0.46rem;
      letter-spacing: 0.09em;
      color: rgba(235, 248, 255, 0.92);
      background: rgba(0,0,0,0.74);
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    /* below display: cork board + control panel */
    .vm-below {
      display: grid;
      grid-template-columns: 56% 44%;
      background: #8e9888;
      border-top: 2px solid #4c5448;
      flex-shrink: 0;
    }

    /* cork notice board — tan/amber like image.jpg */
    .vm-notice {
      background: #8e9888;
      padding: 8px 10px;
      border-right: 2px solid #5c6658;
    }
    .vm-notice-paper {
      background: #c4a03c;
      border-radius: 3px;
      padding: 7px 9px;
      border: 1px solid #9a7e28;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.30), 0 1px 0 rgba(255,255,255,0.04);
    }
    .vm-notice-line {
      height: 2px;
      background: #5c4016;
      border-radius: 1px;
      margin-bottom: 5px;
      opacity: 0.55;
    }
    .vm-notice-line:last-child { margin-bottom: 0; width: 58%; }
    .vm-notice-title {
      font-size: 0.6rem;
      color: #3a2406;
      letter-spacing: 0.12em;
      font-family: 'Noto Serif JP', serif;
      margin-bottom: 5px;
    }

    /* right control panel — dark metal */
    .vm-ctrl-panel {
      background: #28302c;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: flex-start;
    }
    .vm-ctrl-black {
      width: 100%;
      height: 30px;
      background: #0a0e0c;
      border-radius: 2px;
      border: 1px solid #181e1a;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
    }
    .vm-ctrl-slot {
      width: 62%;
      height: 4px;
      background: #060a08;
      border-radius: 2px;
    }

    /* bottom section */
    .vm-bottom {
      background: #28302c;
      border-top: 3px solid #181e1a;
      padding: 7px 10px;
      flex-shrink: 0;
    }
    .vm-btn-row {
      display: flex;
      gap: 5px;
      margin-bottom: 6px;
    }
    .vm-btn {
      flex: 1;
      height: 13px;
      background: #181e1a;
      border-radius: 2px;
      border: 1px solid #222a24;
    }
    .vm-coin-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 5px;
    }
    .vm-coin-slot {
      flex: 1;
      height: 4px;
      background: #060a08;
      border-radius: 2px;
    }
    .vm-indicator-lights { display: flex; gap: 4px; }
    .vm-dot { width: 5px; height: 5px; border-radius: 50%; }
    .vm-dot-g { background: #3af014; box-shadow: 0 0 7px rgba(58,240,20,1); }
    .vm-dot-r { background: #ff2055; box-shadow: 0 0 7px rgba(255,32,85,1); }
    .vm-dispense-housing {
      background: #0a0e0c;
      border-radius: 3px;
      padding: 4px 6px;
      border: 1px solid #181e1a;
    }
    .vm-dispense-slot {
      width: 100%;
      height: 14px;
      background: #040608;
      border-radius: 2px;
    }
  </style>
</head>
<body data-view="street">

<!-- ════════════════════════════════════════ -->
<!-- SCENE VIEW                              -->
<!-- ════════════════════════════════════════ -->
<div id="scene-view" aria-label="A quiet street beneath a spiral galaxy">
<canvas id="galaxy-canvas" aria-hidden="true"></canvas>
<!-- Pre-sky: drifting glow that covers the engine's build. Animated purely on
     transform/opacity so the compositor keeps it moving while init blocks the
     main thread; cross-dissolves out as the live galaxy fades in. -->
<div id="sky-warmup" aria-hidden="true">
  <i></i><i></i><i></i>
  <div class="warm-disc"><div class="warm-arms"></div></div>
  <div class="warm-core"></div>
  <span class="warm-shoot"></span><span class="warm-shoot"></span>
</div>
<svg id="scene-svg" aria-label="Moonlit city, roadside billboard and glowing vending machine" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Sky atmosphere — deep navy/indigo base + vivid magenta nebula -->
  <radialGradient id="sg1" cx="50%" cy="35%" r="65%">
    <stop offset="0%" stop-color="#e040a0" stop-opacity="0.72"/>
    <stop offset="100%" stop-color="#0a0418" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sg2" cx="38%" cy="22%" r="55%">
    <stop offset="0%" stop-color="#c020c8" stop-opacity="0.50"/>
    <stop offset="100%" stop-color="#0a0418" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sg3" cx="65%" cy="18%" r="48%">
    <stop offset="0%" stop-color="#d030b0" stop-opacity="0.40"/>
    <stop offset="100%" stop-color="#0a0418" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sg4" cx="25%" cy="50%" r="42%">
    <stop offset="0%" stop-color="#4a1080" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#0a0418" stop-opacity="0"/>
  </radialGradient>
  <!-- Blue / indigo nebula clouds -->
  <radialGradient id="sg5" cx="88%" cy="28%" r="40%">
    <stop offset="0%" stop-color="#1a40c8" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#0a0418" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sg6" cx="12%" cy="38%" r="36%">
    <stop offset="0%" stop-color="#2030a8" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#0a0418" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sg7" cx="55%" cy="8%" r="38%">
    <stop offset="0%" stop-color="#3050e0" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#0a0418" stop-opacity="0"/>
  </radialGradient>

  <!-- Ground — pink/magenta sky reflection near horizon, dark below -->
  <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#2a0830"/>
    <stop offset="30%"  stop-color="#180620"/>
    <stop offset="100%" stop-color="#060410"/>
  </linearGradient>

  <!-- Road/sidewalk — cool purple-slate -->
  <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#1e1a3a"/>
    <stop offset="50%"  stop-color="#181430"/>
    <stop offset="100%" stop-color="#121028"/>
  </linearGradient>

  <!-- Billboard face, floodlight wash, floodlight flare -->
  <linearGradient id="billFaceG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#241c48"/>
    <stop offset="50%"  stop-color="#2e2158"/>
    <stop offset="100%" stop-color="#1e1640"/>
  </linearGradient>
  <linearGradient id="billLightG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#fff2dd" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#fff2dd" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="billFlareG">
    <stop offset="0%"   stop-color="#fff6e8" stop-opacity="0.9"/>
    <stop offset="30%"  stop-color="#ffeecc" stop-opacity="0.32"/>
    <stop offset="100%" stop-color="#ffeecc" stop-opacity="0"/>
  </radialGradient>

  <!-- VM display illumination -->
  <radialGradient id="vmDispGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#a8ccd8" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#a8ccd8" stop-opacity="0"/>
  </radialGradient>

  <!-- VM floor glow -->
  <radialGradient id="vmFloorG" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#88b8cc" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#88b8cc" stop-opacity="0"/>
  </radialGradient>

  <!-- lamp halos -->
  <radialGradient id="lh1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff9944" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#ff9944" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lh2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff9944" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#ff9944" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lh3" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff9944" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#ff9944" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lh4" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff9944" stop-opacity="0.09"/>
    <stop offset="100%" stop-color="#ff9944" stop-opacity="0"/>
  </radialGradient>

  <!-- Atmosphere fog -->
  <linearGradient id="fogG" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#080418" stop-opacity="0.45"/>
    <stop offset="22%" stop-color="#080418" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#080418" stop-opacity="0"/>
  </linearGradient>

  <!-- Vignette -->
  <radialGradient id="vigG" cx="50%" cy="55%" r="72%">
    <stop offset="0%"   stop-color="#0e0438" stop-opacity="0"/>
    <stop offset="60%"  stop-color="#0e0438" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0e0438" stop-opacity="0.58"/>
  </radialGradient>

  <!-- City background glow -->
  <radialGradient id="cityGlowG" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#c040c0" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#c040c0" stop-opacity="0"/>
  </radialGradient>

  <!-- Moonlight wash from upper-left -->
  <radialGradient id="moonlightG" cx="15%" cy="12%" r="85%">
    <stop offset="0%"   stop-color="#c8a8ff" stop-opacity="0.22"/>
    <stop offset="55%"  stop-color="#c8a8ff" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#c8a8ff" stop-opacity="0"/>
  </radialGradient>

  <!-- Ground purple ambient from moonlight -->
  <radialGradient id="groundAmbG" cx="20%" cy="10%" r="80%">
    <stop offset="0%"   stop-color="#7030b0" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#7030b0" stop-opacity="0"/>
  </radialGradient>

  <!-- Cool lavender sky reflection on ground (matches the reference sky) -->
  <linearGradient id="pinkReflG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#8f7ae0" stop-opacity="0.34"/>
    <stop offset="40%"  stop-color="#6a55c8" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#6a55c8" stop-opacity="0"/>
  </linearGradient>

  <!-- Moonlight shadow from vending machine -->
  <linearGradient id="vmShadowG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#000000" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>

  <!-- Road wet-reflection sheen -->
  <linearGradient id="roadShineG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#8050cc" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#8050cc" stop-opacity="0.04"/>
  </linearGradient>

  <!-- Shutter pattern: horizontal metal strips -->
  <pattern id="shutterP" x="0" y="0" width="300" height="18" patternUnits="userSpaceOnUse">
    <rect width="300" height="9"  fill="#0c0e0c"/>
    <rect y="9" width="300" height="9" fill="#0f110f"/>
    <line x1="0" y1="8.5"  x2="300" y2="8.5"  stroke="#080a08" stroke-width="1.5"/>
    <line x1="0" y1="17.5" x2="300" y2="17.5" stroke="#080a08" stroke-width="1.5"/>
    <!-- subtle 3D ridge highlight -->
    <line x1="0" y1="1" x2="300" y2="1" stroke="#111310" stroke-width="0.5" opacity="0.5"/>
    <line x1="0" y1="10" x2="300" y2="10" stroke="#111310" stroke-width="0.5" opacity="0.5"/>
  </pattern>

  <!-- VM display inner gradient -->
  <linearGradient id="vmDisplayG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#a0c4d4"/>
    <stop offset="100%" stop-color="#88b0c4"/>
  </linearGradient>
  <!-- VM body (pale, night-lit), backlit case interior, shaded side -->
  <linearGradient id="vmBodyG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#9aa294"/>
    <stop offset="55%"  stop-color="#7c8476"/>
    <stop offset="100%" stop-color="#5e665a"/>
  </linearGradient>
  <linearGradient id="vmCaseG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#e8f6f8"/>
    <stop offset="55%"  stop-color="#c2dfe9"/>
    <stop offset="100%" stop-color="#a8cbdc"/>
  </linearGradient>
  <linearGradient id="vmSideG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#383e33"/>
    <stop offset="100%" stop-color="#20251e"/>
  </linearGradient>
  <linearGradient id="vmSkyTintG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#e070d8" stop-opacity="0.18"/>
    <stop offset="45%"  stop-color="#b06ae0" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#b06ae0" stop-opacity="0.04"/>
  </linearGradient>

  <!-- Filters -->
  <filter id="blur8"  x="-60%" y="-60%"   width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="grainF" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85 0.35" numOctaves="4" seed="9"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.05  0 0 0 0 0.18  0 0 0 0.45 0"/>
  </filter>
  <!-- coarse pavement mottling (larger-scale unevenness under the fine grain) -->
  <filter id="grain2F" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.055 0.03" numOctaves="3" seed="17"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.06  0 0 0 0 0.03  0 0 0 0 0.12  0 0 0 0.5 0"/>
  </filter>
  <filter id="blur20" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="blur40" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="tealGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b5"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b2"/>

// ── FRONT VIEW CITY — layered skyline matching the main scene's generator ──
(function () {
  const ns = 'http://www.w3.org/2000/svg';
  const g = document.getElementById('front-city');
  if (!g) return;
  const R = Math.random;
  const BASE = 340;

  function rect(x, y, w, h, fill, op) {

    e.setAttribute('height', Math.max(0.5, h).toFixed(1));
    e.setAttribute('fill', fill);
    if (op !== undefined) e.setAttribute('opacity', op);
    g.appendChild(e);

  }

  // far hazy layer
  for (let fx = 150; fx < 1050;) {
    const fw = 26 + R() * 50;
    const fh = 30 + R() * 55;
    rect(fx, BASE - fh, fw, fh, '#1c1746', 0.85);
    const n = (fw * fh / 320) | 0;

    }
    fx += fw + 3 + R() * 15;
  }
  // near layer — tiered tops, rim light, antennas, structured windows
  for (let bx = 150; bx < 1050;) {
    const bw = 34 + R() * 58;
    const bh = 70 + R() * 115;
    const by = BASE - bh;
    const character = R() < 0.4 ? 0 : R() < 0.75 ? 1 : 2;
    rect(bx, by, bw, bh, '#0b0d15');
    rect(bx, by, 1, bh, '#262048', '0.4');
    rect(bx - 0.7, by - 1.6, bw + 1.4, 1.8, '#0d0f18');
    rect(bx - 0.7, by - 2.2, bw + 1.4, 0.9, '#ff5fd6', (0.14 + R() * 0.26).toFixed(2));
    if (bw > 40 && R() < 0.45) {                       // set-back tier

      rect(tx, by - th, tw, th, '#0b0d15');
      rect(tx - 0.7, by - th - 1.4, tw + 1.4, 1.6, '#0d0f18');
      rect(tx - 0.7, by - th - 2, tw + 1.4, 0.8, '#ff5fd6', '0.2');
    }
    if (bw > 30 && R() < 0.45) {                       // antenna + beacon
      const ax = bx + bw * (0.3 + R() * 0.4);
      const ah = 8 + R() * 13;
      const ant = mk('line');
      ant.setAttribute('x1', ax.toFixed(1)); ant.setAttribute('y1', by.toFixed(1));
      ant.setAttribute('x2', ax.toFixed(1)); ant.setAttribute('y2', (by - ah).toFixed(1));
      ant.setAttribute('stroke', '#0a0c10');
      ant.setAttribute('stroke-width', '1');
      g.appendChild(ant);
      if (R() < 0.5) {
        const tip = mk('circle');
        tip.setAttribute('cx', ax.toFixed(1));
        tip.setAttribute('cy', (by - ah).toFixed(1));
        tip.setAttribute('r', '1.1');
        tip.setAttribute('fill', '#ff3344');
        tip.setAttribute('class', 'roof-blink');
        g.appendChild(tip);
      }
    }
    const cols = Math.max(2, Math.round(bw / 7));
    const rows = Math.max(2, Math.round(bh / 10));
    const cw = (bw - 4) / cols, ch = (bh - 5) / rows;
    const ww = Math.min(2.8, cw * 0.55), wh = Math.min(3.6, ch * 0.55);
    for (let r2 = 0; r2 < rows; r2++) {

                       pal[(R() * pal.length) | 0], (0.4 + R() * 0.55).toFixed(2));

          e.style.setProperty('--dur', (2 + R() * 5).toFixed(1) + 's');
          e.style.setProperty('--dly', (R() * 9).toFixed(1) + 's');
          e.style.setProperty('--lo', '0.15');
          e.style.setProperty('--hi', '0.85');

    if (bh > 85 && bw >= 36 && R() < 0.18) {           // neon sign
      const neonCols = ['#ff2cc8', '#22d4ff', '#b44dff', '#ff5fa0'];
      const vert = R() < 0.6;
      const sign = rect(bx + 4 + R() * (bw - (vert ? 10 : 24)),
                        by + 6 + R() * bh * 0.3,
                        vert ? 2.5 : 9 + R() * 8,
                        vert ? 9 + R() * 12 : 2.5,
                        neonCols[(R() * 4) | 0]);

      sign.setAttribute('class', 'lamp-flicker');

    bx += bw + 4 + R() * 24;

// ── SPIRAL GALAXY ENGINE — canvas particle simulation ──
// Kinematic density-wave galaxy: ~10k particles on progressively-twisted
// elliptical orbits. The arms are a persistent crowding pattern — stars
// stream through them with true differential rotation (inner orbits fast,
// outer slow) and the pattern never winds up. Projected in 3D with
// inclination, perspective, precession and mouse parallax; drawn with
// additive blending so dense regions bloom white-hot like the reference.
// Init is heavy (sprite/mip baking, 10k particles, full-screen sky bake) and
// used to run synchronously during parse, so the browser could not paint for
// ~20s. It now starts after the first frame: the static sky/arrival.svg
// backdrop shows immediately and the galaxy fades in over it via [data-ready].
function startGalaxyEngine() {
  const canvas = document.getElementById('galaxy-canvas');
  if (!canvas || !canvas.getContext) return;
  const BUILD = 42;                 // bump when sky changes — logged to console
  // main display canvas stays GPU-accelerated; all HELPER canvases below are
  // created software-backed (willReadFrequently) — immune to the silent GPU
  // backing-store loss that was blanking the sky on retina/busy systems
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 1.5); // soft glowy content — 1.5x is visually identical, ~44% fewer pixels than 2x
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // scene constants (SVG viewBox coordinates)
  const VW = 1200, VH = 675, SKY = 318;
  const GX = 690, GY = 150;              // galaxy centre
  const R = 430;                          // disc radius
  const INCL = 62 * Math.PI / 180;        // disc inclination (3D tilt)
  const PA   = -11 * Math.PI / 180;       // position angle on screen
  const F = 1500;                         // perspective focal length
  const OMEGA = 3.5;                      // ω(a) = OMEGA / a^0.85 (flat-ish rotation curve)
  const TWIST = 0.0138;                   // orbit-ellipse twist per unit radius → 2 arms

  const rnd = Math.random;
  const fade = (rgb, a) => rgb.replace('rgb(', 'rgba(').replace(')', ',' + a + ')');
  function gauss() {
    return Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(6.283 * rnd());
  }

  // ── pre-rendered sprites (no filters at draw time — pure GPU blits) ──
  function softSprite(size, stops) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d', { willReadFrequently: true });
    const g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    stops.forEach(([o, col]) => g.addColorStop(o, col));
    x.fillStyle = g;
    x.fillRect(0, 0, size, size);
    return c;
  }

  // per-frame CSS filter on the canvas (big compositing cost at retina sizes)
  const GRADE = 'saturate(1.35) brightness(1.08) contrast(1.04)';
  // Safari lacks ctx.filter — detect it and fall back to per-pixel math so the
  // sky looks identical in every browser
  const FILTER_OK = (() => {
    const x = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
    x.filter = 'brightness(1.5)';
    return x.filter !== 'none';
  })();
  function pixelFX(cv, fn) {
    const x = cv.getContext('2d', { willReadFrequently: true });
    const img = x.getImageData(0, 0, cv.width, cv.height);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) fn(d, i);

    return cv;
  }

    for (let ch = 0; ch < 3; ch++) {
      const v = (d[i + ch] * br - 128) * ct + 128;
      d[i + ch] = v < 0 ? 0 : v > 255 ? 255 : v;
    }
  }
  function graded(c) {
    try {
    const g = document.createElement('canvas');
    g.width = c.width; g.height = c.height;
    const x = g.getContext('2d', { willReadFrequently: true });

        let v = (lum + (v0 - lum) * 1.35) * 1.08;
        v = (v - 128) * 1.04 + 128;
        d[i + ch] = v < 0 ? 0 : v > 255 ? 255 : v;

    } catch (e) {                            // fail-open: ungraded beats blank

      return c;
    }
  }

    white: 'rgb(255,255,255)', pale: 'rgb(255,214,242)', pink: 'rgb(255,156,230)',
    hot: 'rgb(255,95,208)',   mag: 'rgb(240,44,200)',   vio: 'rgb(162,77,245)',
    blue: 'rgb(97,116,255)',  ice: 'rgb(170,192,255)',

      const c = document.createElement('canvas');

      c.getContext('2d', { willReadFrequently: true }).drawImage(starSpr[k], 0, 0, ms, ms);

    if (wd <= 3.5) return 1;
    if (wd <= 4.5) return 2;

    skyH = Math.max(1, Math.min(canvas.height, Math.ceil(SKY * s + offy)));
    bg = paintSkyBase(WASHES);
    bakeDeepSky(bg);
    // ── self-heal: Chrome sometimes silently drops canvas backing stores on
    // busy/retina systems; verify the sky actually painted, rebuild if not ──
    const hx = (canvas.width / 2) | 0, hy = ((SKY - 60) * s + offy) | 0;
    if (readbackOK()) {
      for (let tries = 0; tries < 3 && blankAt(bg, hx, hy); tries++) {
        console.warn('[galaxy] sky bg blank — rebuilding, attempt', tries + 1);
        bg = paintSkyBase(WASHES);
        bakeDeepSky(bg);
      }
      if (blankAt(gasTex, (TEX_S / 2) | 0, (TEX_S / 2) | 0) || blankAt(coreSpr, 320, 320)) {
        console.warn('[galaxy] disc textures blank — rebuilding');
        buildDiscTextures();
      }
    }
    // health log (badge removed — sky confirmed working)
    console.log('[galaxy] build', BUILD, '| DPR', DPR, '| canvas',
                canvas.width + 'x' + canvas.height,
                '|', blankAt(bg, hx, hy) ? '⚠️ bg blank' : '✅ sky healthy');
  }
  layout();
  addEventListener('resize', layout);

  // ── state ──
  const fv = document.getElementById('front-view');
  const novae = [];
  let novaAt = 2 + rnd() * 4;
  let t = rnd() * 500, last = performance.now();
  let limit = live.length, ftAcc = 0, ftN = 0;

  // sky base cache — bg + wisps composited only when the slow sway has moved,
  // turning 3 full-screen blits per frame into 1
  let skyCache = null, skyCacheAt = -9, healAt = -9, healCount = 0;
  function drawSkyBase() {
    if (!skyCache || skyCache.width !== canvas.width || skyCache.height !== skyH) {
      skyCache = document.createElement('canvas');
      skyCache.width = canvas.width;
      skyCache.height = skyH;          // sky region only, ~halves the cache memory
      skyCacheAt = -9;
    }
    if (Math.abs(t - skyCacheAt) > 1.2) {    // wisps drift ~1px/s — recomposite sparsely
      const hx = (canvas.width / 2) | 0, hy = ((SKY - 60) * s + offy) | 0;
      // periodic self-heal, throttled: dead backing stores usually recover
      // once the load storm passes; cap attempts so we never rebuild-spin
      if (t - healAt > 2.5 && healCount < 10 &&
          readbackOK() && blankAt(bg, hx, hy)) {
        healAt = t;
        healCount++;
        console.warn('[galaxy] healing sky, attempt', healCount);
        layout();
      }
      skyCacheAt = t;
      const sc = skyCache.getContext('2d', { willReadFrequently: true });
      sc.setTransform(1, 0, 0, 1, 0, 0);
      sc.clearRect(0, 0, skyCache.width, skyCache.height);
      sc.drawImage(bg, 0, 0);
      sc.setTransform(s, 0, 0, s, offx, offy);
      sc.save();
      sc.beginPath(); sc.rect(0, 0, VW, SKY); sc.clip();
      sc.globalCompositeOperation = 'screen';
      sc.globalAlpha = 0.42;
      sc.drawImage(wispPink, Math.sin(t * 0.041) * 55 - 55, 0, VW + 110, SKY);
      sc.globalAlpha = 0.36;
      sc.drawImage(wispBlue, Math.sin(t * 0.057 + 2.1) * 45 - 45, -6, VW + 90, SKY);
      sc.restore();
      if (blankAt(skyCache, hx, hy)) {       // cache store died — recreate next frame
        skyCache = null;
        return;
      }
    }
    if (skyCache) ctx.drawImage(skyCache, 0, 0);
  }

  const POS = [0, 0, 0];                          // scratch — avoids 10k allocs/frame
  function starPos(p, cosI, sinI, cosP, sinP) {
    const ex = p.a * Math.cos(p.tau), ey = p.b * Math.sin(p.tau);
    const xg = ex * p.cb - ey * p.sb;             // galaxy plane
    const yg = ex * p.sb + ey * p.cb;
    const yv = yg * cosI - p.z * sinI;            // incline into view
    const zv = yg * sinI + p.z * cosI;
    const per = F / (F - zv);                     // perspective
    POS[0] = GX + (xg * cosP - yv * sinP) * per;
    POS[1] = GY + (xg * sinP + yv * cosP) * per;
    POS[2] = per;
    return POS;
  }

  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (fv && fv.classList.contains('visible')) return;   // paused behind front view
    if (!REDUCED) t += dt;

    const paNow  = PA   + 0.052 * Math.sin(t * 0.134);              // precession
    const incNow = INCL + 0.061 * Math.sin(t * 0.103 + 1.7);
    const cosI = Math.cos(incNow), sinI = Math.sin(incNow);
    const cosP = Math.cos(paNow),  sinP = Math.sin(paNow);

    if (!REDUCED) {                                       // advance every orbit
      for (const p of stars) p.tau += p.om * dt;
      patAngle += PAT_OM * dt;                            // baked gas/dust layer spins as a pattern
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawSkyBase();
    ctx.setTransform(s, 0, 0, s, offx, offy);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, VW, SKY); ctx.clip();

    // twinkling field stars (static ones + companions are baked into the bg)
    ctx.globalCompositeOperation = 'lighter';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (const p of fieldTw) {
      ctx.globalAlpha = p.al * (0.7 + 0.3 * Math.sin(t * p.tw.f + p.tw.p));
      const m = p.mips[mipIndex(p.sz * 3.6 * s)];
      ctx.drawImage(m, p.x * s + offx - m.width * 0.5, p.y * s + offy - m.width * 0.5);
    }
    ctx.setTransform(s, 0, 0, s, offx, offy);

    // disc-plane layers: one rotating gas+halo texture, one dust texture
    // (baked at init — replaces ~215 large per-frame sprite blits)
    ctx.save();
    ctx.translate(GX, GY); ctx.rotate(paNow); ctx.scale(1, Math.max(cosI, 0.2));
    ctx.rotate(patAngle);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1;
    ctx.drawImage(gasTex, -TEX_R, -TEX_R, TEX_R * 2, TEX_R * 2);
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(dustTex, -TEX_R, -TEX_R, TEX_R * 2, TEX_R * 2);
    ctx.globalCompositeOperation = 'lighter';       // baked faint stars, above the dust
    ctx.drawImage(starTex, -TEX_R, -TEX_R, TEX_R * 2, TEX_R * 2);
    ctx.restore();
    // stars — additive, so the core and arm ridges bloom to white.
    // Drawn in device space from pre-scaled mips: unscaled blits are the
    // difference between lag and 60fps at 10k sprites.
    ctx.globalCompositeOperation = 'lighter';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const boost = Math.pow(live.length / limit, 0.4);
    for (let i = 0; i < limit; i++) {
      const p = live[i];
      const [X, Y, per] = starPos(p, cosI, sinI, cosP, sinP);
      if (Y > SKY + 20 || Y < -20 || X < -30 || X > VW + 30) continue;
      let al = p.al * (0.58 + 0.55 * per * per) * boost;
      if (p.tw) al *= 0.72 + 0.28 * Math.sin(t * p.tw.f + p.tw.p);
      ctx.globalAlpha = Math.min(al, 1);
      const m = p.mips[mipIndex(p.sz * 3.6 * per * s)];
      ctx.drawImage(m, X * s + offx - m.width * 0.5, Y * s + offy - m.width * 0.5);
    }
    ctx.setTransform(s, 0, 0, s, offx, offy);

    // breathing core (single pre-graded sprite, scaled by the breath cycle)
    const breath = 1 + 0.05 * Math.sin(t * 0.97);
    ctx.save();
    ctx.translate(GX, GY); ctx.rotate(paNow); ctx.scale(1, Math.max(cosI, 0.2));
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1;
    const cw = 320 * breath;
    ctx.drawImage(coreSpr, -cw, -cw, cw * 2, cw * 2);
    ctx.restore();

    // supernovae — a real disc star detonates, rides its orbit while fading
    novaAt -= dt;
    if (!REDUCED && novaAt <= 0 && novae.length < 3) {
      novae.push({ p: discRefs[(rnd() * DISC_N) | 0], k: 0 });
      novaAt = 3 + rnd() * 5;
    }
    for (let i = novae.length - 1; i >= 0; i--) {
      const n = novae[i];
      n.k += dt / 1.5;
      if (n.k >= 1) { novae.splice(i, 1); continue; }
      const [X, Y, per] = starPos(n.p, cosI, sinI, cosP, sinP);
      const a = Math.pow(1 - n.k, 1.6);
      const rr = (3 + 40 * n.k) * per;
      ctx.globalAlpha = a;
      ctx.drawImage(starSpr.white, X - rr, Y - rr, rr * 2, rr * 2);
      ctx.globalAlpha = a * 0.6;
      ctx.strokeStyle = 'rgba(255,235,252,0.9)';
      ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.arc(X, Y, rr * 0.9, 0, 7); ctx.stroke();
    }

    // foreground cross-flare stars
    for (const gl of glares) {
      const twk = 0.55 + 0.45 * Math.sin(t * gl.f + gl.p);
      ctx.globalAlpha = gl.al * twk;
      const w = gl.sz * (0.9 + 0.2 * twk);
      ctx.drawImage(glareSpr, gl.x - w / 2, gl.y - w / 2, w, w);
    }

    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // adaptive quality — permanently trim the star budget if frames run long.
    // Stable subset (shuffled array prefix): no temporal dithering, no flicker,
    // and it only ever steps down, so it can't oscillate.
    ftAcc += performance.now() - now; ftN++;
    if (ftN === 120) {
      if (ftAcc / ftN > 20 && limit > live.length * 0.4) limit = (limit * 0.7) | 0;
      ftAcc = 0; ftN = 0;
    }

    // night-world.css holds the canvas at opacity 0 until [data-ready] — flip it
    // once a real frame has painted, so the galaxy fades in over the backdrop
    if (!canvas.dataset.ready) canvas.dataset.ready = 'true';
  }
  requestAnimationFrame(loop);
}
// Start after the page has painted, but never depend on rAF alone to bootstrap:
// a rAF registered during parsing may get no rendering opportunity at all (it
// never fires under headless Chrome), and a sky that silently never builds is
// the exact failure this engine already guards against. Two frames if we get
// them, a timeout if we don't, whichever lands first.
let galaxyStarted = false;
function bootGalaxy() {
  if (galaxyStarted) return;
  galaxyStarted = true;
  startGalaxyEngine();
}
requestAnimationFrame(() => requestAnimationFrame(bootGalaxy));
setTimeout(bootGalaxy, 300);

// ── FRONT-VIEW GALAXY BAND — glitter along the band (closer view) ──
(function () {
  const ns = 'http://www.w3.org/2000/svg';
  const outer = document.getElementById('front-dust');
  const core = document.getElementById('front-dust-core');
  if (!outer || !core) return;
  const R = Math.random;
  const gauss = () => (R() + R() + R() + R() - 2) / 2;
  const CX = 760, CY = -30, TH = -24 * Math.PI / 180;
  const dx = Math.cos(TH), dy = Math.sin(TH);
  const pal = ['#ffffff', '#ffe6ff', '#ffd0f4', '#ffc0ee', '#e6d8ff', '#c0b8ff', '#ff9ae0'];
  function speck(parent, x, y, r, fill, lo, hi) {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1));
    c.setAttribute('r', r.toFixed(2));
    c.setAttribute('fill', fill);
    if (R() < 0.4) {
      c.setAttribute('class', 'star');
      c.style.setProperty('--dur', (R() * 4 + 2).toFixed(1) + 's');
      c.style.setProperty('--dly', (R() * 7).toFixed(1) + 's');
      c.style.setProperty('--lo', lo.toFixed(2));
      c.style.setProperty('--hi', hi.toFixed(2));
    } else {
      c.setAttribute('opacity', hi.toFixed(2));
    }
    parent.appendChild(c);
  }
  for (let i = 0; i < 520; i++) {           // band glitter
    const t = R() * 2 - 1;
    const along = t * 470;
    const spread = gauss() * (70 * (1 - Math.abs(t) * 0.45) + 14);
    const x = CX + dx * along - dy * spread;
    const y = CY + dy * along + dx * spread;
    if (y > 330) continue;
    const big = R() < 0.1;
    speck(outer, x, y, big ? 1.4 + R() * 1.2 : 0.4 + R() * 0.9,
          pal[(R() * pal.length) | 0], R() * 0.2 + 0.15, R() * 0.35 + 0.55);
  }
  for (let i = 0; i < 160; i++) {           // dense white heart
    const t = gauss() * 0.35;
    const along = t * 470;
    const spread = gauss() * 26;
    const x = CX + dx * along - dy * spread;
    const y = CY + dy * along + dx * spread;
    if (y > 330) continue;
    speck(core, x, y, 0.5 + R() * 1.1, R() < 0.6 ? '#ffffff' : '#ffeaff',
          R() * 0.15 + 0.5, R() * 0.1 + 0.88);
  }
})();

// ── VM FRONT — road-facing display drawn in true face perspective ──
// Content is authored in face coordinates (u across, v down) and mapped onto
// the machine's front plane, so shelves/controls foreshorten correctly.
(function () {
  const ns = 'http://www.w3.org/2000/svg';
  const g = document.getElementById('vm-front');
  if (!g) return;
  const U0 = 576, UW = 40;
  const topY = (u) => 331 - 2 * u;
  const botY = (u) => 525 - 28 * u;
  const px = (u) => U0 + UW * u;
  const py = (u, v) => topY(u) + (botY(u) - topY(u)) * v;
  function quad(u1, v1, u2, v2, fill, op, cls, filt) {
    const e = document.createElementNS(ns, 'polygon');
    e.setAttribute('points',
      px(u1).toFixed(2) + ',' + py(u1, v1).toFixed(2) + ' ' +
      px(u2).toFixed(2) + ',' + py(u2, v1).toFixed(2) + ' ' +
      px(u2).toFixed(2) + ',' + py(u2, v2).toFixed(2) + ' ' +
      px(u1).toFixed(2) + ',' + py(u1, v2).toFixed(2));
    e.setAttribute('fill', fill);
    if (op !== undefined) e.setAttribute('opacity', op);
    if (cls) e.setAttribute('class', cls);
    if (filt) e.setAttribute('filter', filt);
    g.appendChild(e);
    return e;
  }

  // backlit display window
  quad(0.06, 0.028, 0.94, 0.50, '#23282a');
  quad(0.085, 0.042, 0.915, 0.487, 'url(#vmCaseG)');
  quad(0.085, 0.042, 0.915, 0.062, '#eef8fa', 0.85);

  // shelves: drinks + price strips
  const rows = [
    { v0: 0.075, v1: 0.135, pal: ['#4cae4e','#e8a020','#f07828','#d84040','#f0c22e','#3a80d0','#dceef2'] },
    { v0: 0.21,  v1: 0.265, pal: ['#2c2c36','#d04888','#f0d040','#68c040','#ececec','#40b0a0','#d0a030'] },
    { v0: 0.345, v1: 0.40,  pal: ['#c8b890','#e05050','#f2f2e8','#e8c040','#4a4a5c','#64aad8','#d8d0b8'] },
  ];
  rows.forEach((row) => {
    row.pal.forEach((col, i) => {
      const u = 0.11 + i * 0.112;
      quad(u, row.v0, u + 0.088, row.v1, col);
      quad(u + 0.012, row.v0 + 0.008, u + 0.03, row.v1 - 0.012, '#ffffff', 0.28);
    });
    quad(0.085, row.v1 + 0.012, 0.915, row.v1 + 0.036, '#e2dccc', 0.92);
    for (let i = 0; i < 7; i++) {
      const u = 0.115 + i * 0.112;
      quad(u, row.v1 + 0.017, u + 0.045, row.v1 + 0.031, '#c04038', 0.85);
    }
  });
  // glass reflection + contained breathing glow
  quad(0.12, 0.05, 0.30, 0.48, '#ffffff', 0.06);
  quad(0.05, 0.02, 0.95, 0.51, '#cfeaf2', undefined, 'glow-pulse', 'url(#blur8)');

  // mid panel: cardboard note + controls
  quad(0.08, 0.545, 0.42, 0.665, '#8a6a3c');
  quad(0.10, 0.553, 0.40, 0.657, '#a07c46');
  quad(0.14, 0.615, 0.36, 0.628, '#4a3618', 0.7);
  quad(0.52, 0.54, 0.92, 0.675, '#565e52');
  quad(0.55, 0.555, 0.73, 0.585, '#14181a');
  quad(0.58, 0.565, 0.70, 0.573, '#040606');
  quad(0.78, 0.55, 0.89, 0.60, '#1a2022');
  quad(0.825, 0.558, 0.845, 0.592, '#060a0a');
  quad(0.55, 0.615, 0.90, 0.655, '#3c443c');
  quad(0.575, 0.624, 0.635, 0.645, '#141a16');
  quad(0.665, 0.624, 0.725, 0.645, '#141a16');
  quad(0.755, 0.624, 0.815, 0.645, '#141a16');
  quad(0.86, 0.627, 0.885, 0.642, '#3af014').setAttribute('filter', 'url(#glow5)');

  // wide dispense flap
  quad(0.07, 0.715, 0.93, 0.83, '#3a423a');
  quad(0.10, 0.73, 0.90, 0.815, '#12161a');
  quad(0.10, 0.73, 0.90, 0.745, '#20262c');
  quad(0.28, 0.762, 0.72, 0.783, '#0a0d10');

  // seams + base plinth
  quad(0.04, 0.53, 0.96, 0.536, '#4a5146', 0.8);
  quad(0.04, 0.70, 0.96, 0.706, '#4a5146', 0.8);

// ── GROUND DETAIL — stains, cracks, mica glints (perspective-scaled) ──
(function () {
  const ns = 'http://www.w3.org/2000/svg';
  const g = document.getElementById('ground-detail');
  if (!g) return;
  const R = Math.random;
  const mk = (t) => document.createElementNS(ns, t);
  function roadX(y) {              // road edges at a given y — keep detail on the sidewalks
    const t = (675 - y) / 357;
    return [360 + 515 * t, 695 + 180 * t];
  }
  for (let i = 0; i < 26; i++) {   // weathering stains
    const y = 340 + Math.pow(R(), 1.4) * 320;
    const k = (y - 318) / 357;
    const [rl, rr] = roadX(y);
    const x = R() < 0.55 ? R() * Math.max(20, rl - 20) : rr + 20 + R() * Math.max(20, 1180 - rr);
    const e = mk('ellipse');
    e.setAttribute('cx', x.toFixed(1)); e.setAttribute('cy', y.toFixed(1));
    e.setAttribute('rx', (14 + R() * 40 * k).toFixed(1));
    e.setAttribute('ry', ((3 + R() * 9) * k + 1).toFixed(1));
    e.setAttribute('fill', R() < 0.7 ? '#07050e' : '#140b26');
    e.setAttribute('opacity', (0.10 + R() * 0.16).toFixed(2));
    e.setAttribute('filter', 'url(#blur8)');
    g.appendChild(e);
  }
  for (let i = 0; i < 8; i++) {    // hairline cracks
    const y0 = 430 + R() * 230;
    const k = (y0 - 318) / 357;
    const [rl, rr] = roadX(y0);
    const x0 = R() < 0.5 ? R() * Math.max(30, rl - 30) : rr + 26 + R() * Math.max(20, 1160 - rr);
    let d = 'M ' + x0.toFixed(1) + ' ' + y0.toFixed(1);
    let cx2 = x0, cy2 = y0;
    const segs = 3 + (R() * 3 | 0);
    for (let s2 = 0; s2 < segs; s2++) {
      cx2 += (R() - 0.5) * 46 * k;
      cy2 += (R() * 14 + 4) * k;
      d += ' L ' + cx2.toFixed(1) + ' ' + cy2.toFixed(1);
    }
    const p = mk('path');
    p.setAttribute('d', d);
    p.setAttribute('stroke', '#0a0718');
    p.setAttribute('stroke-width', (0.7 + k * 0.8).toFixed(2));
    p.setAttribute('fill', 'none');
    p.setAttribute('opacity', '0.4');
    g.appendChild(p);
  }
  for (let i = 0; i < 22; i++) {   // mica glints in the pavement
    const y = 360 + Math.pow(R(), 1.3) * 300;
    const k = (y - 318) / 357;
    const [rl, rr] = roadX(y);
    const x = R() < 0.55 ? R() * Math.max(10, rl - 10) : rr + 12 + R() * Math.max(10, 1180 - rr);
    const c = mk('circle');
    c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1));
    c.setAttribute('r', (0.5 + k * 0.7).toFixed(2));
    c.setAttribute('fill', R() < 0.6 ? '#cabcf8' : '#f8e8ff');
    c.setAttribute('opacity', (0.12 + R() * 0.2).toFixed(2));
    g.appendChild(c);
  }
})();

// ── STREET LAMPS — true perspective series toward the vanishing point ──
// Lamps are world-evenly spaced along the road, which on screen means
// geometric spacing and linear size falloff toward the VP.
(function () {
  const ns = 'http://www.w3.org/2000/svg';
  const g = document.getElementById('street-lamps');
  if (!g) return;
  const mk = (t) => document.createElementNS(ns, t);
  const defs = document.querySelector('#scene-svg defs');

  const halo = mk('radialGradient');
  halo.setAttribute('id', 'lampHaloG2');
  [['0%', '#ffc47a', '0.68'], ['45%', '#ff9944', '0.26'], ['100%', '#ff9944', '0']]
    .forEach(([o, c, a]) => {
      const st = mk('stop');
      st.setAttribute('offset', o);
      st.setAttribute('stop-color', c);
      st.setAttribute('stop-opacity', a);
      halo.appendChild(st);
    });
  defs.appendChild(halo);
  const coneG = mk('linearGradient');
  coneG.setAttribute('id', 'lampConeG');
  coneG.setAttribute('x1', '0'); coneG.setAttribute('y1', '0');
  coneG.setAttribute('x2', '0'); coneG.setAttribute('y2', '1');
  [['0%', '#ffbe6e', '0.5'], ['70%', '#ffa050', '0.10'], ['100%', '#ff9944', '0']]
    .forEach(([o, c, a]) => {
      const st = mk('stop');
      st.setAttribute('offset', o);
      st.setAttribute('stop-color', c);
      st.setAttribute('stop-opacity', a);
      coneG.appendChild(st);
    });
  defs.appendChild(coneG);

  const VPx = 875, VPy = 318;
  for (let i = 0; i < 12; i++) {
    // huge foreground gaps that tighten rapidly down the road — few, far-apart lamps
    const t = 1 - 0.94 * Math.pow(0.40, i);
    const k = 1 - t;                          // perspective scale, →0 at the VP
    if (k < 0.045) break;
    const bx = 695 + (VPx - 695) * t;         // base on the right road edge
    const by = 675 + (VPy - 675) * t;
    const H = 302 * k;                        // taller poles (heads still slope toward the VP)
    const arm = 46 * k;
    const hx = bx - arm, hy = by - H;      // lamp head, hanging over the road

    // light cone falling to the pavement (behind the pole)
    const cnw = mk('g');
    cnw.setAttribute('opacity', (0.24 * Math.pow(k, 0.6)).toFixed(3));
    const cn = mk('polygon');
    cn.setAttribute('points',
      (hx - 5 * k).toFixed(1) + ',' + hy.toFixed(1) + ' ' +
      (hx + 5 * k).toFixed(1) + ',' + hy.toFixed(1) + ' ' +
      (hx + 30 * k).toFixed(1) + ',' + by.toFixed(1) + ' ' +
      (hx - 34 * k).toFixed(1) + ',' + by.toFixed(1));
    cn.setAttribute('fill', 'url(#lampConeG)');
    cn.setAttribute('class', 'lamp-flicker');
    cnw.appendChild(cn);
    g.appendChild(cnw);

    // pool of light on the ground + wet-road reflection streak
    const poolW = mk('g');
    poolW.setAttribute('opacity', (0.72 * k).toFixed(2));
    const pool = mk('ellipse');
    pool.setAttribute('cx', hx.toFixed(1)); pool.setAttribute('cy', by.toFixed(1));
    pool.setAttribute('rx', (34 * k).toFixed(1)); pool.setAttribute('ry', (7.5 * k).toFixed(1));
    pool.setAttribute('fill', 'url(#lampHaloG2)');
    pool.setAttribute('class', 'lamp-flicker');
    poolW.appendChild(pool);
    g.appendChild(poolW);
    const refl = mk('ellipse');
    refl.setAttribute('cx', (hx - 6 * k).toFixed(1));
    refl.setAttribute('cy', Math.min(672, by - 2).toFixed(1));
    refl.setAttribute('rx', (17 * k).toFixed(1)); refl.setAttribute('ry', (4 * k).toFixed(1));
    refl.setAttribute('fill', '#ff9944');
    refl.setAttribute('opacity', (0.32 * k).toFixed(2));
    refl.setAttribute('filter', 'url(#blur8)');
    g.appendChild(refl);

    // pole + base + curved arm
    const pole = mk('line');
    pole.setAttribute('x1', bx.toFixed(1)); pole.setAttribute('y1', by.toFixed(1));
    pole.setAttribute('x2', bx.toFixed(1)); pole.setAttribute('y2', hy.toFixed(1));
    pole.setAttribute('stroke', '#100d22');
    pole.setAttribute('stroke-width', Math.max(0.6, 4.6 * k).toFixed(2));
    pole.setAttribute('stroke-linecap', 'round');
    g.appendChild(pole);
    const base = mk('rect');
    base.setAttribute('x', (bx - 3.4 * k).toFixed(1));
    base.setAttribute('y', (by - 4.5 * k).toFixed(1));
    base.setAttribute('width', (6.8 * k).toFixed(1));
    base.setAttribute('height', (4.5 * k).toFixed(1));
    base.setAttribute('rx', (1.2 * k).toFixed(2));
    base.setAttribute('fill', '#100d22');
    g.appendChild(base);
    const armP = mk('path');
    armP.setAttribute('d',
      'M ' + bx.toFixed(1) + ' ' + hy.toFixed(1) +
      ' Q ' + (bx - arm * 0.55).toFixed(1) + ' ' + (hy - 7 * k).toFixed(1) +
      ' ' + hx.toFixed(1) + ' ' + (hy - 1 * k).toFixed(1));
    armP.setAttribute('stroke', '#100d22');
    armP.setAttribute('stroke-width', Math.max(0.5, 3.4 * k).toFixed(2));
    armP.setAttribute('fill', 'none');
    armP.setAttribute('stroke-linecap', 'round');
    g.appendChild(armP);

    // head housing + halo + glowing tube + hot core
    const head = mk('rect');
    head.setAttribute('x', (hx - 8.5 * k).toFixed(1));
    head.setAttribute('y', (hy - 4.6 * k).toFixed(1));
    head.setAttribute('width', (17 * k).toFixed(1));
    head.setAttribute('height', (5.4 * k).toFixed(1));
    head.setAttribute('rx', (2.4 * k).toFixed(2));
    head.setAttribute('fill', '#151129');
    g.appendChild(head);
    const haloW = mk('g');
    haloW.setAttribute('opacity', Math.min(1, 0.95 * Math.pow(k, 0.45)).toFixed(2));
    const hl = mk('circle');
    hl.setAttribute('cx', hx.toFixed(1)); hl.setAttribute('cy', hy.toFixed(1));
    hl.setAttribute('r', (54 * k + 6).toFixed(1));
    hl.setAttribute('fill', 'url(#lampHaloG2)');
    hl.setAttribute('class', 'lamp-flicker');
    haloW.appendChild(hl);
    g.appendChild(haloW);
    const glass = mk('ellipse');
    glass.setAttribute('cx', hx.toFixed(1)); glass.setAttribute('cy', (hy + 0.6 * k).toFixed(1));
    glass.setAttribute('rx', (6.8 * k).toFixed(1));
    glass.setAttribute('ry', (2.4 * k).toFixed(1));
    glass.setAttribute('fill', '#ffe4b4');
    glass.setAttribute('filter', 'url(#glow5)');
    glass.setAttribute('class', 'lamp-flicker');
    g.appendChild(glass);
    const core = mk('ellipse');
    core.setAttribute('cx', hx.toFixed(1)); core.setAttribute('cy', (hy + 0.4 * k).toFixed(1));
    core.setAttribute('rx', (3.4 * k).toFixed(1));
    core.setAttribute('ry', (1.3 * k).toFixed(1));
    core.setAttribute('fill', '#fff4dc');
    g.appendChild(core);
  }
})();

// ── CITY SKYLINE — layered depth, tiered rooftops, structured windows ──
(function () {
  const ns = 'http://www.w3.org/2000/svg';
  const bldG = document.getElementById('city-buildings');
  const winG = document.getElementById('city-windows');
  if (!bldG || !winG) return;
  const HORIZON = 318;
  const R = Math.random;
  const mk = (tag) => document.createElementNS(ns, tag);
  function rect(parent, x, y, w, h, fill, op) {
    const e = mk('rect');
    e.setAttribute('x', x.toFixed(1)); e.setAttribute('y', y.toFixed(1));
    e.setAttribute('width', Math.max(0.5, w).toFixed(1));
    e.setAttribute('height', Math.max(0.5, h).toFixed(1));
    e.setAttribute('fill', fill);
    if (op !== undefined) e.setAttribute('opacity', op);
    parent.appendChild(e);
    return e;
  }

  // shared vertical body gradient — soft depth on every near building
  const svgDefs = document.querySelector('#scene-svg defs');
  const bodyG = mk('linearGradient');
  bodyG.setAttribute('id', 'bldBodyG');
  bodyG.setAttribute('x1', '0'); bodyG.setAttribute('y1', '0');
  bodyG.setAttribute('x2', '0'); bodyG.setAttribute('y2', '1');
  [['0%', '#111322'], ['55%', '#0a0b13'], ['100%', '#060709']].forEach(([o, c]) => {
    const st = mk('stop');
    st.setAttribute('offset', o);
    st.setAttribute('stop-color', c);
    bodyG.appendChild(st);
  });
  svgDefs.appendChild(bodyG);

  // ── far parallax layer — hazy silhouettes, sparse dim windows ──
  const farPal = ['#a8b4e8', '#c8b0e8', '#e8c8a8'];
  for (let fx = -6; fx < 1206;) {
    const fw = 22 + R() * 54;
    const fh = 28 + R() * 64;
    rect(bldG, fx, HORIZON - fh, fw, fh, '#191440', 0.8);
    const n = (fw * fh / 300) | 0;
    for (let i = 0; i < n; i++) {
      rect(bldG, fx + 2 + R() * (fw - 4), HORIZON - fh + 3 + R() * (fh - 8),
           1.1, 1.6, farPal[(R() * 3) | 0], (0.14 + R() * 0.2).toFixed(2));
    }
    fx += fw + 2 + R() * 14;
  }

  // ── near layer — footprints keep the established composition ──
  const lots = [
    [0,44,88],[48,58,122],[110,38,68],[152,50,105],[206,42,82],[250,36,60],
    [275,52,118],[332,36,72],[373,58,132],[436,42,96],
    [483,54,158],[542,40,106],[587,66,148],[658,46,84],
    [709,50,122],[764,44,98],[813,60,134],[878,46,76],
    [929,64,120],[998,50,90],[1053,56,114],[1114,54,92],[1173,46,70],
    [310,20,88],[358,16,62],[420,18,78],[466,18,68],
    [620,22,105],[695,18,68],[742,24,68],[798,16,75],
    [856,20,98],[918,18,58],[986,20,72],[1040,16,82],[1100,18,65],[1160,20,55],
    [22,16,72],[80,18,95],[132,20,58],[178,16,68],[228,18,75],
  ];
  const warm = ['#f5d065', '#ffe488', '#f2b855', '#fffaaa', '#ffc85a', '#fde8a0'];
  const cool = ['#cfe0ff', '#e8e6ff', '#b8ccf8', '#d8b0ff', '#f0d8ff'];
  let floorGlows = 0;

  function roofDetail(x, w, y) {
    rect(bldG, x - 0.7, y - 1.6, w + 1.4, 1.8, '#0d0f18');           // parapet lip
    rect(bldG, x - 0.7, y - 2.2, w + 1.4, 0.9, '#ff5fd6',
         (0.16 + R() * 0.3).toFixed(2));                             // pink rim light
    if (w > 26 && R() < 0.6) {                                       // rooftop box
      const bw2 = 4 + R() * 7;
      rect(bldG, x + 3 + R() * (w - bw2 - 6), y - 4.4, bw2, 4.4, '#0a0c13');
    }
    if (w > 44 && R() < 0.3) {                                       // water tower
      const wx = x + 8 + R() * (w - 24);
      const legs = mk('path');
      legs.setAttribute('d', 'M ' + (wx + 1.5).toFixed(1) + ' ' + y.toFixed(1) + ' l 1 -3.5 ' +
                             'M ' + (wx + 8.5).toFixed(1) + ' ' + y.toFixed(1) + ' l -1 -3.5');
      legs.setAttribute('stroke', '#0a0c13');
      legs.setAttribute('stroke-width', '1');
      bldG.appendChild(legs);
      rect(bldG, wx, y - 10.5, 10, 7.5, '#0b0d15');
      const cone = mk('polygon');
      cone.setAttribute('points',
        (wx - 0.8).toFixed(1) + ',' + (y - 10.5).toFixed(1) + ' ' +
        (wx + 10.8).toFixed(1) + ',' + (y - 10.5).toFixed(1) + ' ' +
        (wx + 5).toFixed(1) + ',' + (y - 14).toFixed(1));
      cone.setAttribute('fill', '#0d0f18');
      bldG.appendChild(cone);
    }
    if (w > 30 && R() < 0.5) {                                       // antenna
      const ax = x + w * (0.25 + R() * 0.5);
      const ah = 9 + R() * 15;
      const ant = mk('line');
      ant.setAttribute('x1', ax.toFixed(1)); ant.setAttribute('y1', y.toFixed(1));
      ant.setAttribute('x2', ax.toFixed(1)); ant.setAttribute('y2', (y - ah).toFixed(1));
      ant.setAttribute('stroke', '#0a0c10');
      ant.setAttribute('stroke-width', '1');
      bldG.appendChild(ant);
      if (R() < 0.55) {
        const tip = mk('circle');
        tip.setAttribute('cx', ax.toFixed(1));
        tip.setAttribute('cy', (y - ah).toFixed(1));
        tip.setAttribute('r', '1.1');
        tip.setAttribute('fill', '#ff3344');
        tip.setAttribute('class', 'roof-blink');
        winG.appendChild(tip);
      }
    }
  }

  // structured windows: aligned grid, per-floor lighting, building "character"
  // (0 = office: cool tones + occasional fully-lit floor, 1 = residential: warm
  //  scattered, 2 = mostly dark)
  function windows(x, y, w, h, character) {
    const cols = Math.max(2, Math.round(w / 7));
    const rows = Math.max(2, Math.round(h / 9.5));
    const cw = (w - 4) / cols, ch = (h - 5) / rows;
    const ww = Math.min(2.6, cw * 0.55), wh = Math.min(3.4, ch * 0.55);
    for (let r2 = 0; r2 < rows; r2++) {
      const litFloor = character === 0 && R() < 0.16;
      const rate = litFloor ? 0.85 : character === 0 ? 0.3 : character === 1 ? 0.3 : 0.08;
      if (litFloor && floorGlows < 9) {
        floorGlows++;
        const gl = rect(winG, x + 1, y + 2.5 + r2 * ch, w - 2, wh + 2, '#ffd98a', '0.10');
        gl.setAttribute('filter', 'url(#glow5)');
      }
      for (let c = 0; c < cols; c++) {
        if (R() > rate) continue;
        const pal = character === 0 ? (R() < 0.55 ? cool : warm)
                                    : (R() < 0.8 ? warm : cool);
        const op = (0.4 + R() * 0.55).toFixed(2);
        const e = rect(winG,
          x + 2 + c * cw + (cw - ww) / 2,
          y + 2.5 + r2 * ch + (ch - wh) / 2,
          ww, wh, pal[(R() * pal.length) | 0], op);
        if (R() < 0.13) {
          e.setAttribute('class', 'city-win');
          e.style.setProperty('--dur', (2 + R() * 5).toFixed(1) + 's');
          e.style.setProperty('--dly', (R() * 9).toFixed(1) + 's');
          e.style.setProperty('--lo', (parseFloat(op) * 0.3).toFixed(2));
          e.style.setProperty('--hi', op);
        }
      }
    }
  }

  lots.forEach(([bx, bw, bh]) => {
    const by = HORIZON - bh;
    const character = R() < 0.4 ? 0 : R() < 0.75 ? 1 : 2;

    let tier = null;                    // set-back upper tier on wider towers
    if (bw >= 40 && R() < 0.5) {
      const tw = bw * (0.5 + R() * 0.3);
      const th = 10 + R() * 22;
      tier = { x: bx + (R() < 0.5 ? 2 : bw - tw - 2), w: tw, y: by - th, h: th };
    }

    rect(bldG, bx, by, bw, bh, 'url(#bldBodyG)');
    rect(bldG, bx, by, 1, bh, '#262048', '0.4');   // moonlit left edge
    if (tier) {
      rect(bldG, tier.x, tier.y, tier.w, tier.h, 'url(#bldBodyG)');
      rect(bldG, tier.x, tier.y, 1, tier.h, '#262048', '0.4');
      roofDetail(tier.x, tier.w, tier.y);
      windows(tier.x, tier.y, tier.w, tier.h, character);
      rect(bldG, bx - 0.7, by - 1.4, bw + 1.4, 1.6, '#0d0f18');
      rect(bldG, bx - 0.7, by - 2, bw + 1.4, 0.8, '#ff5fd6', (0.14 + R() * 0.2).toFixed(2));
    } else {
      roofDetail(bx, bw, by);
    }

    windows(bx, by, bw, bh, character);

    if (bh > 70 && bw >= 36 && R() < 0.2) {        // buzzing neon sign
      const neonCols = ['#ff2cc8', '#22d4ff', '#b44dff', '#ff5fa0'];
      const vert = R() < 0.6;
      const sign = rect(winG,
        bx + 4 + R() * (bw - (vert ? 10 : 24)),
        by + 6 + R() * bh * 0.35,
        vert ? 2.5 : 9 + R() * 8,
        vert ? 9 + R() * 13 : 2.5,
        neonCols[(R() * 4) | 0]);
      sign.setAttribute('filter', 'url(#glow5)');
      sign.setAttribute('class', 'lamp-flicker');
    }

    if (R() < 0.35 && bh > 80 && !tier) {          // rooftop beacon
      const dot = mk('circle');
      dot.setAttribute('cx', (bx + bw / 2).toFixed(1));
      dot.setAttribute('cy', (by - 3).toFixed(1));
      dot.setAttribute('r', '1.6');
      dot.setAttribute('fill', '#ff2222');
      dot.setAttribute('class', 'roof-blink');
      winG.appendChild(dot);
    }
  });
})();

// ── SHOOTING STARS ──
(function () {
  const ns = 'http://www.w3.org/2000/svg';
  let gradId = 0;

  // cfg: { svgId, groupId, glowFilter, x0, xw, y0, yh }
  function spawnShootingStar(cfg) {
    const svg = document.getElementById(cfg.svgId);
    if (!svg) return;

    const angleDeg = 28 + Math.random() * 22;
    const tailLen  = 90  + Math.random() * 110;
    const dist     = 220 + Math.random() * 280;
    const duration = 700 + Math.random() * 500;

    const sx = cfg.x0 + Math.random() * cfg.xw;
    const sy = cfg.y0 + Math.random() * cfg.yh;
    const dx = Math.cos(angleDeg * Math.PI / 180);
    const dy = Math.sin(angleDeg * Math.PI / 180);

    // Gradient fixed in local space — tail at (-tailLen,0), head at (0,0)
    // userSpaceOnUse coords are in the element's local coordinate system,
    // so they stay aligned with the line as the group moves.
    const gid  = 'ssg' + (gradId++);
    const defs = svg.querySelector('defs');
    const grad = document.createElementNS(ns, 'linearGradient');
    grad.setAttribute('id', gid);
    grad.setAttribute('gradientUnits', 'userSpaceOnUse');
    grad.setAttribute('x1', -tailLen); grad.setAttribute('y1', 0);
    grad.setAttribute('x2', 0);        grad.setAttribute('y2', 0);
    const s0 = document.createElementNS(ns, 'stop');
    s0.setAttribute('offset', '0%'); s0.setAttribute('stop-color', '#ffffff'); s0.setAttribute('stop-opacity', '0');
    const s1 = document.createElementNS(ns, 'stop');
    s1.setAttribute('offset', '100%'); s1.setAttribute('stop-color', '#ffffff'); s1.setAttribute('stop-opacity', '1');
    grad.appendChild(s0); grad.appendChild(s1);
    defs.appendChild(grad);

    // Group holds line + head in local space; only its transform changes each frame
    const container = document.getElementById(cfg.groupId) || svg;
    const g = document.createElementNS(ns, 'g');

    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', -tailLen); line.setAttribute('y1', 0);
    line.setAttribute('x2', 0);        line.setAttribute('y2', 0);
    line.setAttribute('stroke', 'url(#' + gid + ')');
    line.setAttribute('stroke-width', '1.5');
    line.setAttribute('stroke-linecap', 'round');
    g.appendChild(line);

    const head = document.createElementNS(ns, 'circle');
    head.setAttribute('cx', 0); head.setAttribute('cy', 0); head.setAttribute('r', '2');
    head.setAttribute('fill', '#ffffff');
    head.setAttribute('filter', 'url(#' + cfg.glowFilter + ')');
    g.appendChild(head);

    container.appendChild(g);

    // CSS animation handles opacity — zero JS overhead for fade
    const fadeKf = [
      { opacity: 0 },
      { opacity: 1, offset: 0.08 },
      { opacity: 1, offset: 0.75 },
      { opacity: 0 }
    ];
    g.animate(fadeKf, { duration, fill: 'forwards', easing: 'linear' });

    // Only 1 attribute change per frame: the group transform
    const t0 = performance.now();
    function tick(now) {
      if (document.hidden || document.body.dataset.still === 'true' || !document.getElementById('front-view').classList.contains('visible')) {
        g.remove(); grad.remove(); return;
      }
      const p  = Math.min((now - t0) / duration, 1);
      const hx = (sx + dx * dist * p).toFixed(1);
      const hy = (sy + dy * dist * p).toFixed(1);
      g.setAttribute('transform', `translate(${hx},${hy}) rotate(${angleDeg})`);
      if (p < 1) { requestAnimationFrame(tick); }
      else { g.remove(); grad.remove(); }
    }
    requestAnimationFrame(tick);
  }

  function makeScheduler(cfg) {
    function run() {
      const delay = 2000 + Math.random() * 4000;
      setTimeout(() => {
        if (!document.hidden && document.body.dataset.still !== 'true' &&
            !matchMedia('(prefers-reduced-motion: reduce)').matches &&
            document.getElementById('front-view').classList.contains('visible')) spawnShootingStar(cfg);
        run();
      }, delay);
    }
    setTimeout(run, 1000 + Math.random() * 2000);
  }

  // Main scene sky: retired along with the photo background (galaxy replaced it)
  // makeScheduler({ svgId: 'scene-svg', groupId: 'stars', glowFilter: 'glow5',
  //                 x0: 30, xw: 900, y0: 15, yh: 160 });

  // Front view sky: x 200–980, y -100 to 180 (above horizon ~310)
  makeScheduler({ svgId: 'front-svg', groupId: 'front-stars', glowFilter: 'fglow5',
                  x0: 200, xw: 780, y0: -100, yh: 280 });
})();
